name: Refresh volatility table

# Reads daily closes from Yahoo Finance (yfinance), rewrites data/vol.json, rebuilds docs/ and commits.
on:
  schedule:
    - cron: "30 21 * * 5"        # Saturday 06:30 KST, after the Friday close in New York
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vol
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python tools/update_vol.py
      - run: node tests/check.js
      - run: python build.py
      - name: Commit if the table changed
        run: |
          if git diff --quiet -- data/vol.json; then
            echo "volatility table unchanged"; git checkout -- docs; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vol.json docs
          git commit -m "Refresh volatility table"
          git push
